services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────────────
  - type: web
    name: aionos-backend
    env: python
    region: oregon
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && python seed.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AUTH_TOKEN
        value: dev_secret_token_123
      - key: GROQ_API_KEY
        sync: false

  # ── Frontend Static Site (React Vite) ──────────────────────────────────────
  - type: web
    name: aionos-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
