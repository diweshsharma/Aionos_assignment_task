version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aionos_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AUTH_TOKEN=${AUTH_TOKEN:-dev_secret_token_123}
      - DATABASE_URL=sqlite:///./airline_agent.db
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aionos_frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend_data:
